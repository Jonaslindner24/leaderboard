<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Night – Leaderboard</title><link rel="stylesheet" href="/assets/style.css"></head>
<body class="tv"><header><h1>Game Night</h1><div class="sub" id="sub"></div></header>
<main class="board" id="board"></main>
<script src="/socket.io/socket.io.js"></script><script src="/assets/app.js"></script>
<script>
const board = document.getElementById('board');
let first = true;
live(({ players, races }) => {
  document.getElementById('sub').textContent = `${races.filter(r => r.done).length} of ${races.length} races scored`;
  if (!players.length) { board.innerHTML = '<p class="empty">No players yet. Add them in the admin panel.</p>'; return; }
  board.querySelector('.empty')?.remove();
  const old = new Map([...board.children].map(e => [e.dataset.id, e]));
  const before = new Map([...old].map(([k, e]) => [k, e.getBoundingClientRect().top]));
  const ids = new Set(players.map(p => String(p.id)));
  old.forEach((e, k) => { if (!ids.has(k)) e.remove(); });

  players.forEach((p, i) => {
    let row = old.get(String(p.id));
    const isNew = !row;
    if (isNew) {
      row = document.createElement('div');
      row.dataset.id = p.id; row.dataset.n = 0; row.dataset.total = p.total;
      row.style.setProperty('--h', hue(p.slug));
      row.innerHTML = '<span class="rank"></span><span class="avatar"></span><span class="name"></span><span class="chips"></span><span class="pts"><b>0</b><small>pts</small></span>';
      if (first) row.style.animationDelay = i * 80 + 'ms';
    }
    row.classList.remove('r1', 'r2', 'r3'); row.classList.add('row', 'r' + p.rank);
    if (isNew) row.classList.add('enter');
    row.querySelector('.rank').textContent = p.rank + '.';
    row.querySelector('.avatar').textContent = p.name[0].toUpperCase();
    row.querySelector('.name').textContent = p.name;
    const known = +row.dataset.n;
    row.querySelector('.chips').innerHTML = p.history.map((h, k) => chip(h.place, !isNew && k >= known ? 'pop' : '')).join('');
    row.dataset.n = p.history.length;
    countUp(row.querySelector('.pts b'), p.total);
    if (!isNew && +row.dataset.total !== p.total && !reduced) {
      row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
    }
    row.dataset.total = p.total;
    board.appendChild(row); // reorders the rows
  });

  // FLIP: rows glide to their new position
  if (!reduced) board.querySelectorAll('.row').forEach(row => {
    const was = before.get(row.dataset.id);
    if (was == null) return;
    const dy = was - row.getBoundingClientRect().top;
    if (Math.abs(dy) > 1) row.animate([{ transform: `translateY(${dy}px)`, zIndex: 2 }, { transform: 'none', zIndex: 2 }], { duration: 900, easing: 'cubic-bezier(.2,.8,.2,1)' });
  });
  first = false;
});
</script></body></html>
