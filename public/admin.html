<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Night – Admin</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><main class="adm">
<h1>Admin</h1>
<div class="tabs"><button id="tp" class="on">Players</button><button id="tr">Races</button></div>
<section id="players"><form class="add" id="pf"><input id="pn" placeholder="Player name" maxlength="24" required><button class="primary">Add player</button></form><div class="list" id="pl"></div></section>
<section id="races" hidden><form class="add" id="rf"><input id="rn" placeholder="Race name" maxlength="40" required><button class="primary">Add race</button></form><div class="list" id="rl"></div></section>
<p class="err" id="err"></p>
</main>
<dialog id="dlg"></dialog>
<script src="/socket.io/socket.io.js"></script><script src="/assets/app.js"></script>
<script>
let S = { players: [], races: [] }, CFG = { points: [] }, pin = sessionStorage.getItem('pin') || '';
const $ = id => document.getElementById(id), dlg = $('dlg');

async function api(method, url, body, retry = true) {
  const r = await fetch('/api/admin' + url, { method, headers: { 'Content-Type': 'application/json', 'x-admin-pin': pin }, body: body && JSON.stringify(body) });
  if (r.status === 401 && retry) { pin = prompt('Admin PIN') || ''; sessionStorage.setItem('pin', pin); return api(method, url, body, false); }
  const data = await r.json();
  if (!r.ok) { $('err').textContent = data.error; throw new Error(data.error); }
  $('err').textContent = '';
  return data;
}
const act = (...a) => api(...a).catch(() => {});

$('tp').onclick = () => tab(true); $('tr').onclick = () => tab(false);
function tab(p) { $('players').hidden = !p; $('races').hidden = p; $('tp').className = p ? 'on' : ''; $('tr').className = p ? '' : 'on'; }

$('pf').onsubmit = async e => { e.preventDefault(); await act('POST', '/players', { name: $('pn').value }); $('pn').value = ''; };
$('rf').onsubmit = async e => { e.preventDefault(); await act('POST', '/races', { name: $('rn').value }); $('rn').value = ''; };

function render() {
  $('pl').innerHTML = S.players.map(p => `<div class="item"><span class="n">${esc(p.name)}</span><span class="tag">${p.total} pts</span>
    <button data-qr="${p.id}">QR codes</button><button class="danger" data-dp="${p.id}">Delete</button></div>`).join('') || '<p class="empty">No players yet.</p>';
  $('rl').innerHTML = S.races.map(r => `<div class="item"><button class="n" style="text-align:left" data-open="${r.id}">${esc(r.name)}</button>
    <span class="tag">${r.done ? 'scored' : 'open'}</span><button data-rn="${r.id}">Rename</button><button class="danger" data-dr="${r.id}">Delete</button></div>`).join('') || '<p class="empty">No races yet.</p>';
}

document.addEventListener('click', e => {
  const d = e.target.dataset, find = (l, id) => S[l].find(x => x.id == id);
  if (d.dp && confirm(`Delete player "${find('players', d.dp).name}" and all their results?`)) act('DELETE', '/players/' + d.dp);
  if (d.dr && confirm(`Delete race "${find('races', d.dr).name}"?`)) act('DELETE', '/races/' + d.dr);
  if (d.rn) { const n = prompt('New name', find('races', d.rn).name); if (n) act('PUT', '/races/' + d.rn, { name: n }); }
  if (d.qr) showQr(find('players', d.qr));
  if (d.open) openRace(find('races', d.open));
  if (e.target.id === 'close') dlg.close();
});

async function qrSvg(text) { return (await fetch('/api/qr?text=' + encodeURIComponent(text))).text(); }
const wq = s => String(s).replace(/([\\;,:"])/g, '\\$1');

async function showQr(p) {
  const url = `${CFG.baseUrl}/${p.slug}`;
  const [wifi, link] = await Promise.all([qrSvg(`WIFI:T:WPA;S:${wq(CFG.ssid)};P:${wq(CFG.password)};;`), qrSvg(url)]);
  dlg.innerHTML = `<h2>${esc(p.name)}</h2><div class="qrs"><div>${wifi}<p>1. Join Wi-Fi</p></div><div>${link}<p>2. Open page</p></div></div>
    <p>${esc(url)}</p><div class="bar"><button onclick="print()">Print</button><button class="primary" id="close">Close</button></div>`;
  dlg.showModal();
}

async function openRace(r) {
  const saved = await api('GET', `/races/${r.id}/results`).catch(() => []);
  dlg.innerHTML = `<h2>${esc(r.name)}</h2><div class="res"><span class="h">Player</span><span class="h">Place</span><span class="h">Points</span>
    ${S.players.map(p => { const x = saved.find(s => s.playerId === p.id);
      return `<span>${esc(p.name)}</span><input type="number" min="1" inputmode="numeric" data-pl="${p.id}" value="${x?.place ?? ''}">
      <input type="number" inputmode="numeric" data-pt="${p.id}" value="${x ? x.points : ''}" ${x ? 'data-manual="1"' : ''}>`; }).join('')}</div>
    <div class="bar"><button id="close">Cancel</button><button class="primary" id="save">Save</button></div>`;
  dlg.querySelectorAll('[data-pl]').forEach(inp => inp.oninput = () => {
    const pt = dlg.querySelector(`[data-pt="${inp.dataset.pl}"]`);
    if (!pt.dataset.manual) pt.value = inp.value ? (CFG.points[inp.value - 1] ?? 0) : '';
  });
  dlg.querySelectorAll('[data-pt]').forEach(inp => inp.oninput = () => inp.dataset.manual = '1');
  $('save').onclick = async () => {
    const results = S.players.map(p => ({ playerId: p.id,
      place: dlg.querySelector(`[data-pl="${p.id}"]`).value, points: dlg.querySelector(`[data-pt="${p.id}"]`).value }));
    await act('PUT', `/races/${r.id}/results`, { results }); dlg.close();
  };
  dlg.showModal();
}

api('GET', '/config').then(c => CFG = c);
live(s => { S = s; render(); });
</script></body></html>
